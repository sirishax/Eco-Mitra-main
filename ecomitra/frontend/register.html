<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Eco Mitra</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: url('https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?auto=format&fit=crop&q=80') center/cover no-repeat fixed;
            color: white;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.8) 0%, rgba(39, 174, 96, 0.8) 100%);
            z-index: 0;
        }

        .main-bg-gradient {
            position: fixed;
            z-index: 1;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 70% 20%, #60a5fa33 0%, transparent 60%),
                        radial-gradient(circle at 20% 80%, #2563eb22 0%, transparent 70%);
            pointer-events: none;
        }

        .error-message,
        .success-message {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message {
            color: #ffb3b3;
            background: rgba(255, 107, 107, 0.12);
        }

        .success-message {
            color: #d9ffe6;
            background: rgba(34, 197, 94, 0.16);
        }

        .error-message.show,
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body data-auth-mode="guest" hidden>
    <div class="main-bg-gradient"></div>

    <div class="container">
        <div class="auth-card glass-card">
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join us in making sustainable choices</p>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>
            
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="Create a password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password">
                    </div>
                </div>

                <div class="form-options">
                    <label class="terms">
                        <input type="checkbox" name="terms" required>
                        <span>I agree to the <a href="#">Terms & Conditions</a></span>
                    </label>
                </div>

                <button type="submit" class="primary-btn big-btn auth-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div style="margin: 1.5rem 0; text-align: center;">
                <button type="button" id="google-signin-btn" class="primary-btn big-btn auth-btn" style="background:#fff;color:#222;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" style="width:20px;vertical-align:middle;"> Continue with Google
                </button>
            </div>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
